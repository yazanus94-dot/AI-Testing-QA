name: QA Suite
on: [push, pull_request]

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Unit + end-to-end tests
        run: pytest -q
      - name: Run QA suite on sample data (report only; sample data is intentionally defective)
        run: python run_qa.py
      - uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: reports/
